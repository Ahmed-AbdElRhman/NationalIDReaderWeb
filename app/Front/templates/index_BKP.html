<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ID Card Web Processor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    .drop-zone {
      border: 2px dashed #aaa;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      color: #555;
    }
    .image-box {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body class="container py-4">
  <h2 class="mb-4">ID Card Web Processor</h2>

  <!-- Import Image Section -->
  <div class="card mb-4">
    <div class="card-header">1. Import Image Process</div>
    <div class="card-body">
      <div class="row mb-3">
        <!-- Scanner Section -->
        <div class="col-md-6">
          <h5>Scanner</h5>
          <button class="btn btn-primary mb-2" id="loadScannersBtn">Load Scanners</button>
          <select id="scannerSelect" class="form-select mb-2"></select>
          <button class="btn btn-success" id="scanBtn">Scan</button>
        </div>

        <!-- Browse/Drag Section -->
        <div class="col-md-6">
          <h5>Browse or Drag Image</h5>
          <div class="drop-zone" id="dropZone">Drag and drop an image here or click to select
            <input type="file" name="file" id="fileInput" hidden>
          </div>
        </div>
      </div>
      <button class="btn btn-warning" id="startBtn">Start Processing</button>
    </div>
  </div>

  <!-- Uploaded Image -->
  <div class="mb-4">
    <h4>2. Uploaded Image</h4>
    <div class="image-box" id="uploadedImageBox">No image uploaded</div>
  </div>

  <!-- Exported Image -->
  <div class="mb-4">
    <h4>3. Exported Image</h4>
    <div class="image-box" id="exportedImageBox">No processed image</div>
  </div>

  <!-- Extracted Info -->
  <div class="mb-4">
    <h4>4. Extracted Information</h4>
    <div id="result"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    let uploadedFile = null;

    function createField(label, value, id) {
      return `
        <div class="input-group mb-2">
          <span class="input-group-text">${label}</span>
          <input type="text" class="form-control" value="${value}" id="${id}" readonly>
          <button class="btn btn-outline-secondary" type="button" onclick="copyToClipboard('${id}')">Copy</button>
        </div>
      `;
    }

    function copyToClipboard(id) {
      const input = document.getElementById(id);
      input.select();
      document.execCommand("copy");
    }

    $("#loadScannersBtn").click(() => {
      $.get("/list_scanners", data => {
        $("#scannerSelect").empty();
        data.forEach(s => $("#scannerSelect").append(`<option>${s}</option>`));
      });
    });

    $("#scanBtn").click(() => {
      const scanner = $("#scannerSelect").val();
      if (!scanner) return alert("Select a scanner first");
      $.post("/scan", {scanner_name: scanner}, data => {
        uploadedFile = data.image_path;
        $("#uploadedImageBox").html(`<img src="/uploads/${data.image_path.split("/").pop()}" class="img-fluid">`);
      });
    });

    $("#dropZone").on("click", () => $("#fileInput").click());
    $("#dropZone").on("dragover", e => e.preventDefault());
    $("#dropZone").on("drop", e => {
      e.preventDefault();
      $("#fileInput")[0].files = e.originalEvent.dataTransfer.files;
      uploadedFile = null;
      $("#uploadedImageBox").html(`<img src="" id="previewImage" class="img-fluid">`);
      const reader = new FileReader();
      reader.onload = e => $("#previewImage").attr("src", e.target.result);
      reader.readAsDataURL($("#fileInput")[0].files[0]);
    });

    $("#startBtn").click(() => {
      const formData = new FormData();

      if (uploadedFile) {
        // If scanned image was used
        formData.append("path", uploadedFile);
      } else if ($("#fileInput")[0].files.length > 0) {
        formData.append("file", $("#fileInput")[0].files[0]);
      } else {
        return alert("No image selected or scanned");
      }

      $.ajax({
        url: "/process",
        type: "POST",
        data: formData,
        processData: false,
        contentType: false,
        success: data => {
          let html = "";
          Object.entries(data).forEach(([k, v]) => {
            html += createField(k.replace(/_/g, ' ').toUpperCase(), v, `id_${k}`);
          });
          $("#result").html(html);
          $("#exportedImageBox").html('<img src="/uploads/d2.jpg" class="img-fluid">');
        }
      });
    });
  </script>
</body>
</html>
